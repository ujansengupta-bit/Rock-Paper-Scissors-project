<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Rock Paper Scissors</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>Play Rock, Paper, Scissors!</h1>
        <div class="choice">
            <button id="rock" class="playButton">Rock</button>
            <button id="paper" class="playButton">Paper</button>
            <button id="scissors" class="playButton">Scissors</button>
        </div>

        <div id="results"><p>Choose: Rock, Paper, or Scissors to start a new game!</p></div>
        <div id="score"><p>YOU: 0    </p> <p>   Computer: 0</p></div>

        <button id="reset">Reset Game?</button>
        <script src="script.js"></script>
    </body>
</html>

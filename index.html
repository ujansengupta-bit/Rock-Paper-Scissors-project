<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Rock Paper Scissors</title>
    </head>
    <body>
        <link rel="stylesheet" href="style.css">
        <h1>Play Rock, Paper, Scissors!</h1>
        <button id="rock" class="playButton">Rock</button>
        <button id="paper" class="playButton">Paper</button>
        <button id="scissors" class="playButton">Scissors</button>

        <div id="results">Choose Rock, Paper, or Scissors to start a new game!</div>
        <div id="score">YOU: 0  Computer: 0</div>

        <button id="reset">Reset Game?</button>
        <script src="script.js"></script>
    </body>
</html>
